<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .result-box {
            width: auto;
            height: 1.5in;
            transition: all 0.3s ease-in-out;
        }

        .result-box {
            position: relative;
            overflow: hidden;
        }

        .result-box::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1in;
            /* EXACT 1 inch width */
            height: 1in;
            /* EXACT 1 inch height */
            transform: translate(-50%, -50%);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='2538' height='2505' viewBox='0 0 2538 2505' fill='none'><mask id='a' maskUnits='userSpaceOnUse' x='180.817' y='0' width='2200' height='2200' fill='black'><rect fill='white' x='180.817' width='2200' height='2200'/><path d='M2330.82 1100C2330.82 1679.9 1860.72 2150 1280.82 2150C700.918 2150 230.817 1679.9 230.817 1100C230.817 520.101 700.918 50 1280.82 50C1860.72 50 2330.82 520.101 2330.82 1100ZM420.267 1100C420.267 1575.27 805.549 1960.55 1280.82 1960.55C1756.09 1960.55 2141.37 1575.27 2141.37 1100C2141.37 624.731 1756.09 239.45 1280.82 239.45C805.549 239.45 420.267 624.731 420.267 1100Z'/></mask><path d='M2330.82 1100C2330.82 1679.9 1860.72 2150 1280.82 2150C700.918 2150 230.817 1679.9 230.817 1100C230.817 520.101 700.918 50 1280.82 50C1860.72 50 2330.82 520.101 2330.82 1100ZM420.267 1100C420.267 1575.27 805.549 1960.55 1280.82 1960.55C1756.09 1960.55 2141.37 1575.27 2141.37 1100C2141.37 624.731 1756.09 239.45 1280.82 239.45C805.549 239.45 420.267 624.731 420.267 1100Z' fill='black'/><path d='M2330.82 1100C2330.82 1679.9 1860.72 2150 1280.82 2150C700.918 2150 230.817 1679.9 230.817 1100C230.817 520.101 700.918 50 1280.82 50C1860.72 50 2330.82 520.101 2330.82 1100ZM420.267 1100C420.267 1575.27 805.549 1960.55 1280.82 1960.55C1756.09 1960.55 2141.37 1575.27 2141.37 1100C2141.37 624.731 1756.09 239.45 1280.82 239.45C805.549 239.45 420.267 624.731 420.267 1100Z' stroke='white' stroke-width='100' mask='url(%23a)'/><path d='M2495.67 330L2475.83 366.853L2328.83 639.853L2328.61 640.261L2328.37 640.661L1748.37 1628.16L1726.71 1665.05L1705.21 1628.07L1166.21 701.066L1144.36 663.5H1927.27L1907.93 700.163L1773.43 955.163L1766.4 968.5H1685.94L1728 1051.85L1952.09 653H247.478L240.131 641.271L69.1309 368.271L45.1582 330H2495.67Z' fill='black' stroke='white' stroke-width='50'/><path d='M1133.48 663L1140.66 675.678L1389.91 1115.68L1397.35 1128.82L1389.18 1141.52L1367.65 1175H1420.33L1427.59 1187.25L1711.32 1665.75L1718.65 1678.11L1711.66 1690.66L1308.23 2415.16L1263.65 2495.23L1261.55 2410L272.18 700.522L250.463 663H1133.48ZM1281.84 1816.67L1404.24 1744.56L1262.42 1500H1098.66L1281.84 1816.67ZM801.543 986.805L922.2 1195.43L1085.24 1194.69L965.385 986.065L801.543 986.805Z' fill='black' stroke='white' stroke-width='50'/></svg>");
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.08;
            /* Light fade watermark */
            pointer-events: none;
            z-index: 0;
        }



        .btn-hover:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        @page {
            margin: 0;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #printLayout,
            #printLayout * {
                visibility: visible;
            }

            #printLayout {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
        }

        [contenteditable]:focus {
            outline: 2px solid #3b82f6;
            border-radius: 4px;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 9999;
            font-weight: bold;
        }
    </style>
</head>

<body class="bg-gray-200 p-6">

    <!-- Toast -->
    <div id="toast"></div>

    <!-- PRINT LAYOUT -->
    <div id="printLayout" class="w-full bg-white p-10 relative">
        <!-- Blank rows -->
        <div class="h-10 mb-10"></div>
        <div class="h-10 mb-10"></div>
        <div class="h-10 mb-10"></div>
        <div class="h-10 mb-10"></div>
        <div class="h-10 mb-10"></div>
        <div class="h-10 mb-10"></div>

        <!-- Result Box -->
        <div class="absolute top-[100px] right-5">
            <div
                class="result-box flex items-center justify-center text-center p-1 bg-white rounded-lg border-2 border-gray-400">
                <div id="resultDisplay"
                    class="w-full font-bold text-gray-800 tracking-wide leading-snug cursor-pointer">
                    <div class="border-b-2 pb-1">
                        <span class="text-lg font-bold">Check Result</span>
                    </div>
                    <div class="pb-1">
                        <span class="text-sm font-semibold capitalize border-b pb-1">karat & purity</span>
                        <div class="">
                            <span id="displayKarat" class="text-xl font-bold items-center m-1 border-b">00.00 K</span>
                            <br>
                            <span id="displayPurity" class="text-xl font-bold m-1 cursor-text">00.00%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Buttons (Sticky Bottom) -->
    <div class="fixed bottom-0 left-0 w-full bg-white bg-opacity-50 p-4 shadow-lg z-50 flex items-center">
        <div class="flex flex-wrap justify-between items-center gap-4 max-w-[1480px] mx-auto">
            <!-- <div class="flex gap-2 flex-wrap">
                <button onclick="adjustKarat(-0.03)"
                    class="cursor-not-allowed font-semibold px-4 py-2 bg-red-500 text-white rounded-lg shadow-md hover:bg-red-600 btn-hover transition-all">
                    -0.03
                </button>
                <button onclick="adjustKarat(-0.05)"
                    class="cursor-not-allowed font-semibold px-4 py-2 bg-red-500 text-white rounded-lg shadow-md hover:bg-red-600 btn-hover transition-all">
                    -0.05
                </button>
                <button onclick="undoKarat()"
                    class="cursor-not-allowed font-semibold px-4 py-2 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 btn-hover transition-all flex items-center gap-2">
                    <i class="fa fa-undo"></i> Undo
                </button>
            </div> -->

            <button id="printBtn"
                class="font-semibold px-6 py-3 w-full md:w-[700px] bg-gradient-to-r from-gray-800 to-black text-white rounded-lg shadow-lg hover:from-gray-900 hover:to-black btn-hover transition-all flex items-center justify-center gap-2">
                <i class="fa fa-print"></i> Print Layout
            </button>
        </div>
    </div>



    <script>

        let originalKarat = null;

        const displayKarat = document.getElementById("displayKarat");
        const displayPurity = document.getElementById("displayPurity");
        const printBtn = document.getElementById("printBtn");
        const toast = document.getElementById("toast");

        // Make editable
        displayKarat.setAttribute("contenteditable", "true");
        displayPurity.setAttribute("contenteditable", "true");

        // Toast
        const showToast = (msg) => {
            toast.textContent = msg;
            toast.style.display = "block";
            setTimeout(() => (toast.style.display = "none"), 3000);
        };

        // Correct purity formula
        function calculatePurity(k) {
            if (k == 24) {
                return (k / 24) * 99.99;
            } else {
                return (k / 24) * 99.999;
            }
        }

        // Update Display
        const updateDisplay = (karat, manualPurity = null) => {
            karat = Math.max(0, Math.min(24, karat));
            displayKarat.textContent = karat.toFixed(2);

            if (manualPurity !== null) {
                displayPurity.textContent = `${manualPurity.toFixed(2)}%`;
            } else {
                const p = calculatePurity(karat);
                displayPurity.textContent = `${p.toFixed(2)}%`;
            }
        };

        // Auto-select all text on click
        displayKarat.addEventListener("focus", () => {
            const range = document.createRange();
            range.selectNodeContents(displayKarat);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        });

        // Enter key = finish editing
        displayKarat.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                displayKarat.blur();
            }
        });

        // Process Karat input
        displayKarat.addEventListener("blur", () => {
            let k = parseFloat(displayKarat.textContent);

            if (isNaN(k) || k <= 0 || k > 24) {
                k = 24;
            }

            // Always show 2 decimals
            displayKarat.textContent = k.toFixed(2) + " K";

            // High-precision purity calculation
            const purity = calculatePurity(k);

            // Final output with rounding
            displayPurity.textContent = purity.toFixed(2) + "%";
        });

        // PURITY manual typing
        displayPurity.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();

                let p = parseFloat(displayPurity.textContent.replace("%", ""));

                if (isNaN(p) || p <= 0 || p > 100) {
                    showToast("Invalid purity!");
                    return;
                }

                displayPurity.textContent = `${p.toFixed(2)}%`;
                displayPurity.blur();
            }
        });

        // Shortcut buttons
        const adjustKarat = (amount) => {
            let k = parseFloat(displayKarat.textContent) || 0;
            k = k + amount;

            if (k <= 0) {
                showToast("Karat cannot be zero!");
                return;
            }

            if (originalKarat === null) originalKarat = k;

            updateDisplay(k);
        };

        // Undo
        const undoKarat = () => {
            if (originalKarat !== null) {
                updateDisplay(originalKarat);
            }
        };

        // Print
        printBtn.onclick = () => {
            let k = parseFloat(displayKarat.textContent);

            if (isNaN(k) || k <= 0) {
                showToast("Cannot print: Karat is invalid!");
                return;
            }

            window.print();
        };

    </script>

</body>

</html>
